name: release

# 每次发版除了更新公告（update.md），还要在 GitHub 上有一份 Release。
# 这个 workflow 负责把 docs/releases/<版本>.md 变成真正的 Release：
#   · 按 tag 取对应那一版的源码，重新构建四个产物 → 挂成附件（旧版本也能拿到旧附件）
#   · 下载表里的体积与 sha256 由构建结果现算，不靠手抄
#   · 已有同名 Release 就更新正文与附件，没有才新建
# 所以以后发版的固定动作只有两条：写 update.md 的小节 + 写 docs/releases/<版本>.md，然后推 main。

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      # 改发布脚本也要能重发：附件命名、正文模板都在这里
      - 'scripts/publish-release.mjs'
      - 'scripts/release-notes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（要拿全量 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 找出这次新增 / 改动的 Release 稿
        id: pick
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed=$(ls docs/releases/*.md 2>/dev/null || true)
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}" -- docs/releases || true)
          fi

          # 只保留仍然存在的文件（删稿不删 Release）
          keep=""
          for f in $changed; do
            if [ -f "$f" ]; then keep="$keep $f"; fi
          done

          # 没有新稿子时，补发「当前版本」那一份：改 CI、重跑、漏发都能靠这条补上。
          # 已经有同名 Release 的话，后面的 gh release view 会走 edit 分支，不会重复建。
          if [ -z "$keep" ] && [ -f src/00-head.js ]; then
            ver=$(grep -o "MOON_FORMULA_VERSION = '[0-9][0-9.]*'" src/00-head.js | head -1 | sed "s/.*'\(.*\)'/\1/")
            if [ -n "$ver" ] && [ -f "docs/releases/$ver.md" ]; then
              keep=" docs/releases/$ver.md"
              echo "没有新稿子，补发当前版本 $ver"
            fi
          fi

          echo "files=$keep" >> "$GITHUB_OUTPUT"
          if [ -z "$keep" ]; then echo "没有需要发布的稿子"; else echo "本次处理：$keep"; fi

      - name: 构建并发布
        if: steps.pick.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel

          for f in ${{ steps.pick.outputs.files }}; do
            ver=$(basename "$f" .md)
            tag="v$ver"

            # 有 tag 就按 tag 那一版构建（历史版本补发时，附件必须是当年那一版）
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              ref="$tag"
              target_args=""
              echo "→ $tag（按 tag 构建）"
            else
              ref="HEAD"
              target_args="--target ${{ github.sha }}"
              echo "→ $tag（没有 tag，按当前 HEAD 建，release 时连同 tag 一起创建）"
            fi

            work="/tmp/rel/$ver"
            git worktree add --detach "$work" "$ref" >/dev/null
            ( cd "$work" && node scripts/build.mjs >/dev/null && node scripts/build.mjs --flavor=base >/dev/null )

            title=$(node scripts/release-notes.mjs "$ver" --title)
            node scripts/release-notes.mjs "$ver" --assets="$work" > "/tmp/rel/$ver.md"

            assets=""
            for a in moon-phase.js moon-phase.base.js "Galgame攻略系统-酒馆助手导入.json" "DokiDoki-原版-酒馆助手导入.json"; do
              if [ -f "$work/$a" ]; then assets="$assets $work/$a"; fi
            done

            # Release 本身走 scripts/publish-release.mjs（直接打 REST API）：
            # gh 失败只给「HTTP 422」，而中文附件名会让 REST 接口直接 500。
            # 附件则交给 gh：它的上传客户端自带指数退避，比我们手写的重试更能扛
            # GitHub 资产存储偶发的 502（Error updating policy）。
            node scripts/publish-release.mjs \
              --tag "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "/tmp/rel/$ver.md" \
              --no-assets

            # 附件名必须是纯 ASCII（中文名 REST 上传必 500，gh 会转义成 .-. 这种乱码名）
            mkdir -p /tmp/rel/up
            cp "$work/moon-phase.js" "/tmp/rel/up/moon-phase.js"
            cp "$work/moon-phase.base.js" "/tmp/rel/up/moon-phase-base.js"
            cp "$work/Galgame攻略系统-酒馆助手导入.json" "/tmp/rel/up/Galgame-Assistant-Import.json"
            cp "$work/DokiDoki-原版-酒馆助手导入.json" "/tmp/rel/up/DokiDoki-Base-Import.json"

            # 只传缺的：已经传上去的别再删了重传（2.7MB × 4，传挂了还占带宽）
            existing=$(gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null || true)
            missing=""
            for f in /tmp/rel/up/*; do
              n=$(basename "$f")
              if printf '%s\n' "$existing" | grep -Fxq "$n"; then
                echo "  · 已存在，跳过 $n"
              else
                missing="$missing $f"
              fi
            done

            if [ -z "$missing" ]; then
              echo "✅ 四个附件齐全"
            else
              # GitHub 的资产存储会成片地返回 502（Error updating policy），
              # 隔十几秒重试往往还在同一个故障窗口里 —— 退避拉长到分钟级。
              for attempt in 1 2 3 4 5 6; do
                if gh release upload "$tag" $missing; then
                  echo "✅ 附件已上传"
                  break
                fi
                if [ "$attempt" = "6" ]; then
                  echo "::error::$tag 附件上传 6 次都失败（正文已更新，重跑 workflow 会补齐）"
                  exit 1
                fi
                wait=$((attempt * 20))
                [ "$wait" -gt 120 ] && wait=120
                echo "::warning::$tag 附件上传失败，$wait 秒后重试（第 $attempt 次）"
                sleep "$wait"
              done
            fi

            git worktree remove "$work" --force >/dev/null
          done
